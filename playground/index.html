<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动手试试 · 练习场 | 图形学教程</title>
  <!-- 编辑器用 CDN 引入的 CodeMirror（工具页不是教学示例，允许第三方库）；
       CDN 加载失败时 playground.js 会降级为纯文本框 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
      color: #e8e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }

    header { display: flex; align-items: baseline; gap: 18px; padding: 14px 20px 10px; }
    header h1 { font-size: 1.15rem; margin: 0; font-weight: 700; }
    header a { color: #6ee7ff; text-decoration: none; font-size: 0.85rem; }
    header a:hover { text-decoration: underline; }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 230px 1fr 1fr;
      gap: 14px;
      padding: 0 16px 16px;
    }

    /* 左侧题目列表 */
    aside { overflow-y: auto; }
    .ex-group { font-size: 0.78rem; color: #6ee7ff; letter-spacing: 1px; margin: 14px 0 6px; }
    .ex-group:first-child { margin-top: 2px; }
    .ex-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 9px 11px;
      margin-bottom: 8px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.04);
      color: inherit;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .ex-btn:hover { border-color: rgba(110, 231, 255, 0.5); }
    .ex-btn.active { border-color: #6ee7ff; background: rgba(110, 231, 255, 0.1); }
    .ex-title { display: block; font-size: 0.9rem; font-weight: 600; }
    .ex-task { display: block; font-size: 0.75rem; color: #9aa0b4; margin-top: 3px; line-height: 1.5; }

    .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }

    /* 任务栏 */
    .taskbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 0.82rem;
      color: #9aa0b4;
    }
    .taskbar .grow { flex: 1; line-height: 1.5; }
    .taskbar button {
      padding: 5px 14px;
      border-radius: 7px;
      border: 1px solid rgba(110, 231, 255, 0.4);
      background: rgba(110, 231, 255, 0.12);
      color: #6ee7ff;
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .taskbar button:hover { background: rgba(110, 231, 255, 0.22); }
    #status { font-size: 0.75rem; white-space: nowrap; }
    #status.ok { color: #34d399; }
    #status.err { color: #f87171; white-space: normal; }

    /* 编辑区（CodeMirror 或降级 textarea 都填满它） */
    .editor-wrap {
      flex: 1;
      min-height: 0;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: #12121f;
      overflow: hidden;
    }
    .editor-wrap .CodeMirror { height: 100%; font-size: 13px; line-height: 1.7; }
    /* 让 CodeMirror 配色贴近网站主题 */
    .CodeMirror, .CodeMirror-gutters { background: #12121f !important; }
    .CodeMirror-gutters { border-right: 1px solid rgba(255, 255, 255, 0.07) !important; }
    .CodeMirror-linenumber { color: #4a5165 !important; }
    .CodeMirror-cursor { border-left: 1px solid #e8e8f0 !important; }
    /* 降级模式：纯 textarea 占满编辑区 */
    #editor.fallback-visible {
      display: block;
      width: 100%;
      height: 100%;
      padding: 12px 14px;
      background: #12121f;
      color: #d6deeb;
      border: 0;
      outline: none;
      resize: none;
      font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
      tab-size: 4;
    }

    .caption { font-size: 0.78rem; color: #9aa0b4; margin: 0 0 8px; padding: 0 2px; }
    #preview {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      background: #000;
    }

    @media (max-width: 900px) {
      body { overflow: auto; height: auto; }
      main { display: block; }
      aside { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; }
      .ex-group { display: none; }
      .ex-btn { min-width: 170px; flex-shrink: 0; }
      .editor-wrap { height: 48vh; margin-bottom: 12px; }
      #preview { height: 55vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🧪 动手试试 · 练习场</h1>
    <a href="../index.html">← 返回首页</a>
  </header>

  <main>
    <aside id="ex-list"></aside>

    <section class="col">
      <div class="taskbar">
        <span class="grow" id="task">任务加载中…</span>
        <span id="status"></span>
        <button id="run">▶ 运行</button>
        <button id="reset">↺ 重置</button>
      </div>
      <div class="editor-wrap">
        <textarea id="editor"></textarea>
      </div>
    </section>

    <section class="col">
      <p class="caption">运行结果（按 ⌘/Ctrl + Enter 或点「▶ 运行」刷新；出错会在画面顶部提示行号）</p>
      <iframe id="preview" title="运行结果"></iframe>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="playground.js"></script>
</body>
</html>
